<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prospecto</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="frosted-glass">
  <!-- Frosted Glass Layer with Luminous Refractions -->
  <div class="bg-glow"></div>

  <main class="shell">
    <!-- Left Rail: User Profile Avatar & Neural Orb -->
    <aside class="left-rail">
      <div class="avatar user-avatar" title="User Profile">
        <img src="assets/user_avatar.svg" alt="User avatar" />
      </div>
      <div class="avatar orb" title="Assistant Orb"></div>
    </aside>

    <!-- Left Panel: Chat & Knowledge Stream -->
    <section class="panel chat-panel">
      <header class="chat-header">
        <button class="pill pill-dark" id="modelBtn" title="Prospecto AI">
          <svg class="prospecto-logo-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.5L20.5 7.5V16.5L12 21.5L3.5 16.5V7.5L12 2.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M12 2.5V21.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
            <path d="M3.5 7.5L20.5 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
            <path d="M3.5 16.5L20.5 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
            <circle cx="12" cy="12" r="3.2" fill="#38bdf8" stroke="#ffffff" stroke-width="1.6"/>
          </svg>
          Prospecto
        </button>
        <button class="pill pill-outline" id="versionBtn" title="Model Version">
          6.0 <span class="caret">▾</span>
        </button>
        <button class="link-btn" id="shareBtn" title="Share discussion">Share</button>
      </header>

      <h1 class="chat-title" id="chatTitle">The Science and Philosophy of Consciousness</h1>

      <!-- Dynamic Messages rendered via TypeScript -->
      <div class="messages" id="messages"></div>

      <!-- Message Composer -->
      <form class="composer" id="composer">
        <button type="button" class="icon-btn" title="Voice input" id="voiceBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 18v3" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
        <span class="divider"></span>
        <input id="input" type="text" placeholder="Ask anything" autocomplete="off" />
        <button type="submit" class="icon-btn plus" title="Send message">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 4v16M4 12h16"/>
          </svg>
        </button>
      </form>
    </section>

    <!-- Resizer Slider between Chat and Notes -->
    <div class="resizer-slider" id="panelResizer" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize panels (Double-click to reset)">
      <div class="resizer-handle"></div>
    </div>

    <!-- Center Panel: Notes Workspace with Staggered Grid -->
    <section class="panel notes-panel">
      <h2 class="notes-title">Notes</h2>
      <div class="notes-toolbar">
        <nav class="tabs" id="tabs">
          <button class="tab active" data-filter="all">All</button>
          <button class="tab" data-filter="highlight">Highlights</button>
          <button class="tab" data-filter="link">Links</button>
          <button class="tab" data-filter="media">Media</button>
        </nav>
        <button class="pill pill-light group-btn" title="Toggle Grouped View">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
            <rect width="5" height="5" rx="1"/>
            <rect x="7" width="5" height="5" rx="1"/>
            <rect y="7" width="5" height="5" rx="1"/>
            <rect x="7" y="7" width="5" height="5" rx="1"/>
          </svg>
          Group
        </button>
      </div>

      <!-- Notes Grid rendered via TypeScript -->
      <div class="notes-grid" id="notesGrid"></div>

      <!-- Floating Actions Pill -->
      <button class="actions-btn" title="Actions & Ambiance">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/>
        </svg>
        Actions
      </button>
    </section>

    <!-- Right Rail: Global Navigation Dock -->
    <aside class="right-rail">
      <button class="rail-item" id="newChatBtn" title="Create new chat">
        <span class="create-bubble">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </span>
        <span>Create chat</span>
      </button>
      
      <button class="rail-item" title="View all chats">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <circle cx="4" cy="6" r="1.2" fill="currentColor"/>
          <circle cx="4" cy="12" r="1.2" fill="currentColor"/>
          <circle cx="4" cy="18" r="1.2" fill="currentColor"/>
        </svg>
        <span>All chats</span>
      </button>

      <div class="spacer"></div>

      <button class="rail-item" title="Search workspace">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16" y1="16" x2="21" y2="21"/>
        </svg>
        <span>Search</span>
      </button>

      <button class="rail-item" title="Filter media items">
        <span class="images-thumb"></span>
        <span>Images</span>
      </button>
    </aside>
  </main>

  <!-- Compiled TypeScript Application Bundle -->
  <script type="module" src="dist/app.js"></script>
</body>
</html>
