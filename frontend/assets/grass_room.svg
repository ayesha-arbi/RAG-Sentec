<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a4a896"/>
      <stop offset="50%" stop-color="#cbd0bc"/>
      <stop offset="100%" stop-color="#b6bca4"/>
    </linearGradient>
    <linearGradient id="sunlight" x1="0.8" y1="0" x2="0.2" y2="0.9">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#fff4c2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boothGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f27042"/>
      <stop offset="100%" stop-color="#c9491e"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#eadfca"/>
      <stop offset="100%" stop-color="#c8bca2"/>
    </linearGradient>
    <radialGradient id="grassGrad" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#738f42"/>
      <stop offset="45%" stop-color="#55702d"/>
      <stop offset="85%" stop-color="#3d5220"/>
      <stop offset="100%" stop-color="#2d3d17"/>
    </radialGradient>
    <filter id="grassTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0.2 0 0 0 0.25  0 0.5 0 0 0.45  0 0 0.1 0 0.15  0 0 0 0.8 0" in="noise" result="coloredNoise"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="coloredNoise"/>
    </filter>
  </defs>

  <!-- Room Walls -->
  <rect width="400" height="190" fill="url(#wallGrad)" />
  
  <!-- Left Wall angle -->
  <polygon points="0,0 70,0 70,190 0,220" fill="#8d927d" opacity="0.65" />
  
  <!-- Window frame and sunlight -->
  <rect x="130" y="20" width="130" height="100" fill="#d9ecf2" />
  <rect x="135" y="25" width="58" height="90" fill="#eaf6fc" />
  <rect x="197" y="25" width="58" height="90" fill="#eaf6fc" />
  <polygon points="130,20 260,20 380,320 60,320" fill="url(#sunlight)" style="mix-blend-mode: screen;" />

  <!-- Orange Booth Seating on Right & Left -->
  <!-- Left small seat -->
  <path d="M 50,190 L 85,185 L 85,240 L 40,245 Z" fill="#d6572b" />
  <!-- Back booth -->
  <path d="M 220,150 L 330,150 Q 345,150 345,165 L 345,210 L 210,210 Z" fill="url(#boothGrad)" />
  <rect x="225" y="140" width="115" height="24" rx="6" fill="#e65a28" />

  <!-- Grass Floor -->
  <path d="M 0,170 Q 200,165 400,170 L 400,320 L 0,320 Z" fill="url(#grassGrad)" filter="url(#grassTexture)" />

  <!-- Lush grassy tufts foreground -->
  <ellipse cx="200" cy="270" rx="220" ry="60" fill="#5c7a2d" opacity="0.4" />
  <ellipse cx="120" cy="290" rx="80" ry="35" fill="#6f8f36" opacity="0.5" />
  <ellipse cx="290" cy="285" rx="90" ry="40" fill="#6f8f36" opacity="0.4" />

  <!-- Modern Table in Center -->
  <!-- Table Legs -->
  <line x1="165" y1="210" x2="160" y2="255" stroke="#9da49e" stroke-width="4.5" stroke-linecap="round" />
  <line x1="265" y1="205" x2="260" y2="250" stroke="#8c938d" stroke-width="4.5" stroke-linecap="round" />
  <line x1="170" y1="225" x2="260" y2="220" stroke="#7e857f" stroke-width="2.5" />
  
  <!-- Table Top Perspective -->
  <polygon points="140,190 285,185 270,215 125,220" fill="url(#tableTop)" stroke="#a1947b" stroke-width="1.5" />

  <!-- Items on Table -->
  <ellipse cx="185" cy="198" rx="8" ry="4" fill="#ffffff" opacity="0.8" />
  <rect x="182" y="188" width="6" height="10" rx="1.5" fill="#e3f0f7" opacity="0.75" />
  <ellipse cx="225" cy="195" rx="12" ry="5" fill="#9e7b57" opacity="0.6" />
</svg>
