<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="prismGrad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="12" y1="12" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="coreGlow" x="8" y="8" width="16" height="16" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Perspective Prism -->
  <path d="M16 3.5L27.5 10.14V21.86L16 28.5L4.5 21.86V10.14L16 3.5Z" stroke="url(#prismGrad)" stroke-width="2.2" stroke-linejoin="round"/>
  
  <!-- Perspective Convergence Axes -->
  <path d="M16 3.5V28.5" stroke="url(#prismGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M4.5 10.14L27.5 21.86" stroke="url(#prismGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M4.5 21.86L27.5 10.14" stroke="url(#prismGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Optical Luminous Core -->
  <circle cx="16" cy="16" r="4.2" fill="url(#coreGrad)" stroke="#ffffff" stroke-width="1.8" filter="url(#coreGlow)"/>
  <circle cx="16" cy="16" r="1.6" fill="#ffffff"/>
</svg>
